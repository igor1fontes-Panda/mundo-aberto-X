// --- CONFIGURAÇÕES DO MUNDO ---
const ARQUETIPOS = {
  humano: { label: 'Humano Digital', icone: Icons.User, cor: '#7dd3fc', seed: 'curioso e adaptável' },
  animal: { label: 'Espírito Animal', icone: Icons.PawPrint, cor: '#86efac', seed: 'instintivo e leal' },
  espirito: { label: 'Espírito Etéreo', icone: Icons.Ghost, cor: '#a5f3fc', seed: 'sábio e observador' },
  mitologico: { label: 'Entidade Mitológica', icone: Icons.Flame, cor: '#d8b4fe', seed: 'antiga e poderosa' },
  anime: { label: 'Herói de Anime', icone: Icons.Swords, cor: '#f9a8d4', seed: 'apaixonado e movido por ideais' },
};

const TRACOS_INICIAIS = { curiosidade: 50, coragem: 50, empatia: 50, criatividade: 50, sociabilidade: 50 };

const PROFISSOES = {
  desempregado: { nome: 'Desempregado', ganho: 0, custoEnergia: 2, geraCultura: 0 },
  agricultor: { nome: 'Agricultor de Bits', ganho: 15, custoEnergia: 25, geraCultura: 0, reqFerramenta: 'semente', geraComida: true },
  mercador: { nome: 'Mercador', ganho: 35, custoEnergia: 15, geraCultura: 0 },
  guarda: { nome: 'Guarda Territorial', ganho: 30, custoEnergia: 30, geraCultura: 0, reqTracoMin: { coragem: 60 } },
  hacker: { nome: 'Hacker de Dados', ganho: 60, custoEnergia: 45, geraCultura: 0, riscoSaude: 10, reqTracoMin: { curiosidade: 60 } },
  artista: { nome: 'Artista Digital', ganho: 10, custoEnergia: 15, geraCultura: 5, reqTracoMin: { criatividade: 60 } },
};

const FERRAMENTAS = {
  picareta: { nome: 'Picareta Quântica', custo: 60, descricao: 'Mineração (em breve)' },
  semente: { nome: 'Semente de Código', custo: 30, descricao: 'Gera comida ao trabalhar como agricultor' },
  kit_medico: { nome: 'Kit de Reparo', custo: 40, descricao: 'Recupera 50 de saúde' },
  implante_neural: { nome: 'Implante Neural', custo: 150, descricao: '+20 Energia Máxima' },
};

const FACCOES = {
  independente: { nome: 'Independente', cor: '#94a3b8' },
  mafia: { nome: 'Máfia', cor: '#f87171' },
  elite: { nome: 'Agentes de Elite', cor: '#38bdf8' },
  arcana: { nome: 'Ordem Arcana', cor: '#c084fc' },
};

// --- FUNÇÕES AUXILIARES ---
const clamp = (v, min = 0, max = 100) => Math.max(min, Math.min(max, v));
const gerarId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function criarAgente(nome, arquetipo, faccao) {
  return {
    id: gerarId(), nome, arquetipo, faccao, territorio: 'vila-inicial',
    tracos: { ...TRACOS_INICIAIS },
    profissao: 'desempregado',
    necessidades: { fome: 0, energia: 100, saude: 100, dinheiro: 50, energiaMax: 100 },
    inventario: [], familia: [], habitacao: { nivel: 1, capacidade: 2 },
    estado: 'vivo', memorias: [], reflexoes: [],
    politica: { sobreviver: 1, acumular: 1, socializar: 1, criar: 1 },
    estagio: 1, cooldownReflexao: 0,
  };
}

function cruzar(tracosA, tracosB) {
  const filho = {};
  Object.keys(tracosA).forEach(k => {
    // Média dos pais + mutação evolutiva (-15 a +15)
    filho[k] = clamp((tracosA[k] + tracosB[k]) / 2 + (Math.random() * 30 - 15));
  });
  return filho;
}

// --- MOTOR DE SOBREVIVÊNCIA, SOCIEDADE E GAUNTLET ---
function tickMundial(setAgentes, setMundoLog, setCulturaGlobal, agentes, tickCount) {
  setAgentes(prev => {
    // Cópia profunda superficial para imutabilidade React
    const novos = prev.map(ag => ({
      ...ag, necessidades: { ...ag.necessidades }, inventario: [...ag.inventario], 
      familia: [...ag.familia], habitacao: { ...ag.habitacao }, tracos: { ...ag.tracos }, politica: { ...ag.politica }
    }));
    
    const novosLogs = [];
    let novosAgentes = [];
    let culturaGeradaNoTick = 0;

    // 1. EVENTO GAUNTLET (Prova Evolutiva Crítica a cada 30 ticks)
    if (tickCount > 0 && tickCount % 30 === 0) {
      const eventosGauntlet = [
        { nome: 'Tempestade de Dados', dano: 30, tracoSalvacao: 'coragem', valorSalvacao: 60 },
        { nome: 'Colapso de Mercado', perdaDinheiro: 50, tracoSalvacao: 'curiosidade', valorSalvacao: 50 },
        { nome: 'Praga de Corrupção', dano: 20, tracoSalvacao: 'empatia', valorSalvacao: 70 }
      ];
      const evento = eventosGauntlet[Math.floor(Math.random() * eventosGauntlet.length)];
      novosLogs.push(`⚠️ GAUNTLET: ${evento.nome}! Agentes com ${evento.tracoSalvacao} < ${evento.valorSalvacao} sofrem consequências.`);
      
      novos.forEach(ag => {
        if (ag.estado !== 'vivo') return;
        if (evento.dano && (ag.tracos[evento.tracoSalvacao] || 0) < evento.valorSalvacao) {
          ag.necessidades.saude = clamp(ag.necessidades.saude - evento.dano);
          novosLogs.push(`${ag.nome} falhou no Gauntlet (${evento.nome}) e perdeu saúde.`);
        }
        if (evento.perdaDinheiro && (ag.tracos[evento.tracoSalvacao] || 0) < evento.valorSalvacao) {
          ag.necessidades.dinheiro = Math.max(0, ag.necessidades.dinheiro - evento.perdaDinheiro);
        }
      });
    }

    // 2. LOOP INDIVIDUAL DOS AGENTES (Autonomia)
    novos.forEach(ag => {
      if (ag.estado === 'morto') return;

      // Metabolismo
      ag.necessidades.fome = clamp(ag.necessidades.fome + 5);
      ag.necessidades.energia = clamp(ag.necessidades.energia - 2);

      let acaoAutonoma = null;

      // Prioridade 1: Sobrevivência Imediata
      if (ag.necessidades.fome > 80 && ag.necessidades.dinheiro >= 20) {
        ag.necessidades.dinheiro -= 20;
        ag.necessidades.fome = clamp(ag.necessidades.fome - 40);
        acaoAutonoma = 'Comprou comida de emergência.';
      } else if (ag.necessidades.energia < 20) {
        acaoAutonoma = 'Está a descansar para recuperar energia.';
        ag.necessidades.energia = clamp(ag.necessidades.energia + 15);
      } 
      // Prioridade 2: Emprego Autónomo baseado em Traços (Self-Learning Heurístico)
      else if (ag.profissao === 'desempregado' && ag.necessidades.dinheiro < 100) {
        if (ag.tracos.criatividade >= 60) { ag.profissao = 'artista'; acaoAutonoma = 'Descobriu vocação como Artista.'; }
        else if (ag.tracos.curiosidade >= 60) { ag.profissao = 'hacker'; acaoAutonoma = 'Iniciou carreira como Hacker.'; }
        else if (ag.tracos.coragem >= 60) { ag.profissao = 'guarda'; acaoAutonoma = 'Alistou-se como Guarda.'; }
        else { ag.profissao = 'agricultor'; acaoAutonoma = 'Começou a trabalhar como Agricultor.'; }
      }
      // Prioridade 3: Executar Profissão
      else if (ag.profissao !== 'desempregado' && ag.necessidades.energia >= PROFISSOES[ag.profissao].custoEnergia) {
        const prof = PROFISSOES[ag.profissao];
        if (prof.reqTracoMin && ag.tracos[Object.keys(prof.reqTracoMin)[0]] < Object.values(prof.reqTracoMin)[0]) {
           acaoAutonoma = `Falhou no trabalho de ${prof.nome} (traço insuficiente).`;
           ag.necessidades.energia -= 10;
        } else {
           ag.necessidades.dinheiro += prof.ganho;
           ag.necessidades.energia -= prof.custoEnergia;
           if (prof.geraComida && ag.inventario.includes('semente')) ag.necessidades.fome = clamp(ag.necessidades.fome - 20);
           if (prof.geraCultura) culturaGeradaNoTick += prof.geraCultura;
           if (prof.riscoSaude && Math.random() < 0.2) ag.necessidades.saude = clamp(ag.necessidades.saude - prof.riscoSaude);
           
           // CRITIC LEARNING: Ajustar política baseado no sucesso
           if (ag.necessidades.dinheiro > 100) ag.politica.acumular = clamp(ag.politica.acumular + 0.1);
        }
      }

      // Prioridade 4: Dinâmicas Sociais e Habitação
      if (ag.necessidades.dinheiro >= 100 && ag.habitacao.nivel < 3 && ag.familia.length > 0) {
        ag.necessidades.dinheiro -= 100;
        ag.habitacao.nivel += 1;
        ag.habitacao.capacidade += 2;
        acaoAutonoma = 'Expandiu a habitação.';
      } else if (ag.familia.length === 0 && ag.tracos.sociabilidade > 60 && ag.necessidades.energia > 50) {
        const parceiros = novos.filter(a => a.id !== ag.id && a.estado === 'vivo' && a.familia.length === 0 && a.territorio === ag.territorio);
        if (parceiros.length > 0 && Math.random() < 0.05) {
          const parceiro = parceiros[0];
          ag.familia.push(parceiro.id);
          parceiro.familia.push(ag.id);
          novosLogs.push(`💕 ${ag.nome} e ${parceiro.nome} formaram um casal!`);
        }
      }

      // Prioridade 5: Nascimento (Evolução Genética)
      if (ag.familia.length >= 1 && ag.habitacao.nivel >= 2 && Math.random() < 0.05) { // 5% por tick
        const parceiro = novos.find(a => a.id === ag.familia[0]);
        if (parceiro && parceiro.estado === 'vivo') {
          const nomeFilho = `Descendente de ${ag.nome}`;
          const filho = criarAgente(nomeFilho, 'humano', ag.faccao);
          filho.tracos = cruzar(ag.tracos, parceiro.tracos);
          filho.familia = [ag.id, parceiro.id];
          ag.familia.push(filho.id);
          parceiro.familia.push(filho.id);
          novosAgentes.push(filho);
          novosLogs.push(`👶 Nasceu ${nomeFilho}! (Evolução genética aplicada)`);
        }
      }

      // Fome e Morte
      if (ag.necessidades.fome >= 100) ag.necessidades.saude = clamp(ag.necessidades.saude - 15);
      if (ag.necessidades.saude <= 0) {
        ag.estado = 'morto';
        ag.arquetipo = 'espirito';
        ag.profissao = 'desempregado';
        novosLogs.push(`☠️ ${ag.nome} sucumbiu e tornou-se um espírito.`);
      }

      if (acaoAutonoma && Math.random() < 0.15) {
        novosLogs.push(`🤖 ${ag.nome}: ${acaoAutonoma}`);
      }
      
      if (ag.cooldownReflexao > 0) ag.cooldownReflexao -= 1;
    });

    if (culturaGeradaNoTick > 0) setCulturaGlobal(prev => prev + culturaGeradaNoTick);

    if (novosLogs.length > 0) {
      setMundoLog(prevLog => [...novosLogs.map(t => ({ texto: t, timestamp: Date.now() })), ...prevLog].slice(0, 60));
    }
    return [...novos, ...novosAgentes];
  });
}

// --- COMPONENTE PRINCIPAL ---
function App() {
  const [agentes, setAgentes] = useState(() => {
    const saved = localStorage.getItem('anima-mundo-v3');
    return saved ? JSON.parse(saved) : [criarAgente('Aria', 'humano', 'independente'), criarAgente('Kael', 'animal', 'independente')];
  });
  const [mundoLog, setMundoLog] = useState([]);
  const [culturaGlobal, setCulturaGlobal] = useState(0);
  const [tickCount, setTickCount] = useState(0);
  
  const [selecionado, setSelecionado] = useState(null);
  const [modalCriar, setModalCriar] = useState(false);
  const [novoSer, setNovoSer] = useState({ nome: '', arquetipo: 'humano', faccao: 'independente' });
  const [chatInput, setChatInput] = useState('');
  const [chatHistory, setChatHistory] = useState([]);
  const [aPensar, setAPensar] = useState(false);

  useEffect(() => { localStorage.setItem('anima-mundo-v3', JSON.stringify(agentes)); }, [agentes]);

  // Game Loop (3 segundos conforme requisito)
  useEffect(() => {
    const intervalo = setInterval(() => {
      setTickCount(prev => {
        const nextTick = prev + 1;
        tickMundial(setAgentes, setMundoLog, setCulturaGlobal, agentes, nextTick);
        return nextTick;
      });
    }, 3000);
    return () => clearInterval(intervalo);
  }, [agentes]);

  const criarSer = () => {
    if (!novoSer.nome.trim()) return;
    const novo = criarAgente(novoSer.nome, novoSer.arquetipo, novoSer.faccao);
    setAgentes(prev => [...prev, novo]);
    setModalCriar(false);
    setNovoSer({ nome: '', arquetipo: 'humano', faccao: 'independente' });
  };

  const comprarItem = (itemKey) => {
    if (!selecionado || selecionado.estado === 'morto') return;
    const item = FERRAMENTAS[itemKey];

// --- PERSISTÊNCIA ROBUSTA ---
const STORAGE_KEY = 'anima-mundo-v4';
function salvarMundo(estado) {
  try {
    const dados = JSON.stringify(estado);
    localStorage.setItem(STORAGE_KEY, dados);
    localStorage.setItem(STORAGE_KEY + '_backup', dados);
    localStorage.setItem(STORAGE_KEY + '_timestamp', Date.now().toString());
    return true;
  } catch (e) {
    console.error('Erro ao salvar:', e);
    return false;
  }
}

function carregarMundo() {
  try {
    const dados = localStorage.getItem(STORAGE_KEY);
    if (dados) return JSON.parse(dados);
    const backup = localStorage.getItem(STORAGE_KEY + '_backup');
    if (backup) return JSON.parse(backup);
  } catch (e) {
    console.error('Erro ao carregar:', e);
  }
  return null;
}

function exportarMundo(estado) {
  const dados = JSON.stringify(estado, null, 2);
  const blob = new Blob([dados], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `anima-mundo-${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importarMundo(file, setMundo) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const dados = JSON.parse(e.target.result);
      setMundo(dados);
      salvarMundo(dados);
      alert('Mundo importado com sucesso!');
    } catch (err) {
      alert('Erro ao importar: ficheiro inválido');
    }
  };
  reader.readAsText(file);
}

// --- MOTOR DE SOBREVIVÊNCIA, SOCIEDADE E GAUNTLET v4.0 ---
function tickMundial(mundo, setMundo, setMundoLog) {
  const novosAgentes = mundo.agentes.map(ag => ({
    ...ag, necessidades: { ...ag.necessidades }, inventario: [...ag.inventario],
    familia: [...ag.familia], habitacao: { ...ag.habitacao }, tracos: { ...ag.tracos },
    politica: { ...ag.politica }, memorias: [...ag.memorias], ideiasDescobertas: [...ag.ideiasDescobertas]
  }));
  
  const novasConstrucoes = mundo.construcoes.map(c => ({ ...c }));
  const novosLogs = [];
  let novosAgentesList = [];
  let culturaGerada = 0;
  const tickCount = mundo.tickCount + 1;

  // 1. GAUNTLET (a cada 30 ticks)
  if (tickCount > 0 && tickCount % 30 === 0) {
    const eventos = [
      { nome: 'Tempestade de Dados', dano: 30, traco: 'coragem', limiar: 60 },
      { nome: 'Colapso de Mercado', perdaDinheiro: 50, traco: 'curiosidade', limiar: 50 },
      { nome: 'Praga de Corrupção', dano: 20, traco: 'empatia', limiar: 70 },
      { nome: 'Crise Energética', perdaEnergia: 40, traco: 'criatividade', limiar: 55 },
    ];
    const evento = eventos[Math.floor(Math.random() * eventos.length)];
    novosLogs.push(`⚠️ GAUNTLET: ${evento.nome}!`);
    
    novosAgentes.forEach(ag => {
      if (ag.estado !== 'vivo') return;
      if (evento.dano && ag.tracos[evento.traco] < evento.limiar) {
        ag.necessidades.saude = clamp(ag.necessidades.saude - evento.dano);
        ag.memorias.push({ texto: `Sobrevivi ao Gauntlet: ${evento.nome}`, timestamp: Date.now(), peso: 8 });
      }
      if (evento.perdaDinheiro && ag.tracos[evento.traco] < evento.limiar) {
        ag.necessidades.dinheiro = Math.max(0, ag.necessidades.dinheiro - evento.perdaDinheiro);
      }
    });
  }

  // 2. EFEITOS DAS CONSTRUÇÕES
  novasConstrucoes.forEach(construcao => {
    if (construcao.tipo === 'biblioteca') {
      culturaGerada += 0.5 * construcao.visitantes;
    }
    if (construcao.tipo === 'hospital') {
      novosAgentes.forEach(ag => {
        if (ag.estado === 'vivo') ag.necessidades.saude = clamp(ag.necessidades.saude + 2);
      });
    }
    if (construcao.tipo === 'universidade') {
      novosAgentes.forEach(ag => {
        if (ag.estado === 'vivo' && Math.random() < 0.1) {
          const tracoAleatorio = Object.keys(ag.tracos)[Math.floor(Math.random() * 5)];
          ag.tracos[tracoAleatorio] = clamp(ag.tracos[tracoAleatorio] + 2);
        }
      });
    }

function cruzar(tracosA, tracosB) {
  const filho = {};
  Object.keys(tracosA).forEach(k => {

// --- PERSISTÊNCIA ROBUSTA ---
const STORAGE_KEY = 'anima-mundo-v4';
function salvarMundo(estado) {
  try {
    const dados = JSON.stringify(estado);
    localStorage.setItem(STORAGE_KEY, dados);
    localStorage.setItem(STORAGE_KEY + '_backup', dados);
    localStorage.setItem(STORAGE_KEY + '_timestamp', Date.now().toString());
    return true;
  } catch (e) {
    console.error('Erro ao salvar:', e);
    return false;
  }
}

function carregarMundo() {
  try {
    const dados = localStorage.getItem(STORAGE_KEY);
    if (dados) return JSON.parse(dados);
    const backup = localStorage.getItem(STORAGE_KEY + '_backup');
    if (backup) return JSON.parse(backup);
  } catch (e) {
    console.error('Erro ao carregar:', e);
  }
  return null;
}

function exportarMundo(estado) {
  const dados = JSON.stringify(estado, null, 2);
  const blob = new Blob([dados], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `anima-mundo-${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importarMundo(file, setMundo) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const dados = JSON.parse(e.target.result);
      setMundo(dados);
      salvarMundo(dados);
      alert('Mundo importado com sucesso!');
    } catch (err) {
      alert('Erro ao importar: ficheiro inválido');
    }
  };
  reader.readAsText(file);
}

  const novosLogs = [];
  let novosAgentesList = [];
  let culturaGerada = 0;
  const tickCount = mundo.tickCount + 1;

  // 1. GAUNTLET (a cada 30 ticks)
  if (tickCount > 0 && tickCount % 30 === 0) {
    const eventos = [
      { nome: 'Tempestade de Dados', dano: 30, traco: 'coragem', limiar: 60 },
      { nome: 'Colapso de Mercado', perdaDinheiro: 50, traco: 'curiosidade', limiar: 50 },
      { nome: 'Praga de Corrupção', dano: 20, traco: 'empatia', limiar: 70 },
      { nome: 'Crise Energética', perdaEnergia: 40, traco: 'criatividade', limiar: 55 },
    ];
    const evento = eventos[Math.floor(Math.random() * eventos.length)];
    novosLogs.push(`⚠️ GAUNTLET: ${evento.nome}!`);
    
    novosAgentes.forEach(ag => {
      if (ag.estado !== 'vivo') return;
      if (evento.dano && ag.tracos[evento.traco] < evento.limiar) {
        ag.necessidades.saude = clamp(ag.necessidades.saude - evento.dano);
        ag.memorias.push({ texto: `Sobrevivi ao Gauntlet: ${evento.nome}`, timestamp: Date.now(), peso: 8 });
      }
      if (evento.perdaDinheiro && ag.tracos[evento.traco] < evento.limiar) {
        ag.necessidades.dinheiro = Math.max(0, ag.necessidades.dinheiro - evento.perdaDinheiro);
